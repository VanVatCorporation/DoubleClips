plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vanvatcorporation.doubleclips'
    compileSdk 35

    defaultConfig {
        applicationId "com.vanvatcorporation.doubleclips"
        minSdk 24
        targetSdk 35
        versionCode 26
        versionName "1.3.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            debugSymbolLevel 'FULL'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
    buildFeatures {
        buildConfig = true
        shaders true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
task prepareKotlinBuildScriptModel {

}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation("com.squareup.okhttp3:okhttp:5.3.2")

    // Media3 ExoPlayer
    implementation "androidx.media3:media3-exoplayer:1.9.0"
    implementation "androidx.media3:media3-ui:1.9.0"


//    implementation files('libs/ffmpeg-kit-full-gpl-6.0-2.LTS.aar') // full 4kb
//    implementation files('libs/ffmpeg-kit-lts-ndk-r25-16k.aar') // partially 16kb (lack perspective)
//    implementation files('libs/ffmpeg-kit-main-ndk-r25-16k.aar') // partially 16kb (lack perspective)
    implementation files('libs/ffmpeg-kit-16kb-6.1.1.aar') // full 16kb (untested)
    implementation 'com.arthenica:smart-exception-java:0.2.1'
//    implementation 'com.moizhassan.ffmpeg:ffmpeg-kit-16kb:6.1.1'

    implementation files('libs/rajawali-1.2.1970.aar')
    implementation files('libs/IndicatorSeekbar.aar')



    // Retrofit & OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.0'

    // Advanced Cookie Management
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:4.9.0'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.8.9'

    // ML Kit Selfie Segmentation
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
}